services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # 未设置 API_IMAGE 时用本地标签，release 仍走 build。
    # 设为 VPC 引用 crpi-zpeirnr1a18s4043-vpc.cn-shenzhen.personal.cr.aliyuncs.com/juyouu/deploy-api:<tag> 后，ctl.sh 改为 pull。
    image: ${API_IMAGE:-activity-api:local}
    # 默认 never：不要去仓库拉 activity-api:local。
    # pull 模式由 ctl.sh 把 API_PULL_POLICY 设为 always（pull）再设回 never（up --no-build）。
    # `up --build` 会强制重新构建，不受 never 影响。
    pull_policy: ${API_PULL_POLICY:-never}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 维护开关：存在 maintenance.on 时 /api 对外 503（见 default.conf）
      - ./nginx/runtime:/etc/nginx/runtime:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  api_uploads:

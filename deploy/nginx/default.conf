server {
    listen 80;
    server_name _;

    location = / {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok";
    }

    # 维护窗：宿主机 touch deploy/nginx/runtime/maintenance.on 后 reload。
    # 对外 /api/*（含 /api/health）一律 503；探活走容器内 HEALTHCHECK。
    location /api/ {
        if (-f /etc/nginx/runtime/maintenance.on) {
            return 503;
        }

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_page 503 @maintenance_json;

    location @maintenance_json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Retry-After 60 always;
        return 503 '{"code":"MAINTENANCE","message":"系统升级中，请稍后再试"}';
    }
}
